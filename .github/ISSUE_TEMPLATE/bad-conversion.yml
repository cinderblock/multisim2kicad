name: Bad conversion
description: Report a design that failed to convert or doesn't match the original
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Reports on real designs are the best way to shake out edge cases.

        **Don't attach a private design you aren't allowed to share.** You can still file a useful report without sharing your original files:
        - Copy the design, delete everything except the part that broke, and attach the stripped-down copy.
        - Or decode the file to XML with `ewd` (`electronics-workbench-decoder`), delete the sensitive parts, and attach the trimmed XML.
        - Or just describe the problem with side-by-side screenshots and any ERC/DRC lines or `--debug` output.
  - type: input
    id: ew-version
    attributes:
      label: Multisim / Ultiboard version and file type
      placeholder: Multisim 14.2 (.ms14), Ultiboard 14.2 (.ewprj)
    validations:
      required: true
  - type: input
    id: kicad-version
    attributes:
      label: KiCad version
      placeholder: "10.0.1"
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: multisim2kicad version
      description: Output of `npx multisim2kicad --version`
      placeholder: "0.2.3"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: What went wrong
      multiple: true
      options:
        - The command failed or crashed
        - Schematic (missing/wrong parts, wires, nets, labels)
        - PCB (missing/wrong pads, tracks, vias, zones, outline)
        - Schematic and PCB don't link up
        - Libraries (symbols / footprints)
        - Simulation (SPICE)
        - Something else
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected vs. what KiCad shows. Side-by-side screenshots of the EW original and the KiCad result help, as do the relevant ERC/DRC lines.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: If the command failed, run it again with `--debug` and paste the output here.
      render: text
  - type: textarea
    id: files
    attributes:
      label: Design files (optional)
      description: Drag in a zipped design if you can share it, a stripped-down copy, or trimmed XML decoded with `ewd`.
